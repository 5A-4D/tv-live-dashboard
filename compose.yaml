name: tv-live-dashboard
services:
  dashboard:
    container_name: tv-live-dashboard
    image: tv-live-dashboard:local
    build: ./server
    user: "1000:1000"
    init: true
    network_mode: host
    environment:
      ALLOWED_CLIENTS: "${TV_ALLOWED_CLIENTS:-127.0.0.1}"
      LISTEN_ADDRESS: "${TV_SERVER_ADDRESS:-127.0.0.1}"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: bind
        source: ./state/feed
        target: /feed
        read_only: true
      - type: bind
        source: ./state/private/dashboard_token
        target: /run/secrets/dashboard_token
        read_only: true
      - type: bind
        source: ./state/private/teams_receiver.json
        target: /run/secrets/teams_receiver.json
        read_only: true
      - type: bind
        source: ./state/signals
        target: /signals
        read_only: false
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=8m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 160m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://' + os.environ.get('LISTEN_ADDRESS', '127.0.0.1') + ':8768/healthz', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 3
